# ================================================================
# НАСТРОЙКИ KONVERT: DOCX -> FB2 / EPUB
# ================================================================
#
# Как указывать пути:
#   1. Относительный путь — отсчитывается от папки с этим config.ini:
#      input = book.docx
#      input = books/my-book.docx
#
#   2. Абсолютный путь — полный путь к файлу или папке:
#      input = C:\Users\Имя\Documents\Книги\Моя книга\book.docx
#
# Пути с пробелами НЕ нужно заключать в кавычки. Иначе кавычки станут
# частью имени файла.
#
# Запуск с этим конфигом:
#   python main.py config.ini
#
# Можно положить отдельный config.ini рядом с каждой книгой и передать
# программе путь к папке:
#   python main.py "D:\Книги\Моя книга"
# ================================================================

[book]

# Исходная книга в формате DOCX.
# Файл должен существовать. Исходник программа не изменяет.
input = book.docx

# Текстовый файл с названием, автором и другими сведениями о книге.
# Кодировка файла — UTF-8. Поддерживаемый пример содержимого:
#   title=Название книги
#   author=Имя Фамилия
#   genre=fantasy
#   lang=ru
#   sequence=Название цикла
#   sequence_number=1
#   annotation=Первый абзац||Второй абзац
#   date=2026
# Символы || в annotation разделяют описание на несколько абзацев.
metadata = metadata.txt

# Обложка книги в формате JPG.
# Параметр необязательный: если файл не существует, книга будет создана
# без обложки. Рекомендуемое имя — cover.jpg.
cover = cover.jpg

# Копия DOCX после автоматического преобразования разметки:
#   *текст*       -> курсив;
#   **текст**     -> жирный;
#   ***текст***   -> жирный курсив;
#   > текст       -> цитата первого уровня;
#   >> текст      -> цитата второго уровня.
# Этот путь ОБЯЗАТЕЛЬНО должен отличаться от input, чтобы исходник
# не был перезаписан.
normalized = book.normalized.docx

# Папка, в которую будут записаны book.fb2 и/или book.epub.
# Точка означает папку, в которой расположен этот config.ini.
# Если указанной папки нет, программа создаст её автоматически.
# Примеры:
#   output_dir = .
#   output_dir = result
#   output_dir = D:\Готовые книги
output_dir = .

[output]

# Какие файлы требуется создать. Значения перечисляются через запятую.
# Допустимы только fb2 и epub, регистр букв значения не имеет.
#
# Создать сразу оба файла:
#   formats = fb2, epub
#
# Создать только FB2:
#   formats = fb2
#
# Создать только EPUB:
#   formats = epub
formats = fb2, epub

[normalization]

# Нужно ли создавать исправленную копию DOCX перед конвертацией.
# Рекомендуемое значение — yes.
#
# Допустимые варианты включения:
#   yes, true, on, 1
#
# Допустимые варианты отключения:
#   no, false, off, 0
#
# При enabled = no программа читает исходный input напрямую. В таком режиме
# разметка со звёздочками и символами > автоматически не преобразуется,
# но жирный и курсив, заданные средствами Word, продолжают обрабатываться.
enabled = yes

# Текстовый отчёт о выполненной нормализации и найденных проблемах:
# несбалансированных маркерах, неподдерживаемом форматировании и сносках.
# Используется при enabled = yes.
report = conversion-report.txt
